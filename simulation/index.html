<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLVE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css"
    />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="./css/table.css" />
    <link rel="stylesheet" href="css/query.css" />
    <script
      defer
      src="https://code.jquery.com/jquery-3.7.0.min.js"
      integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.plot.ly/plotly-2.12.1.min.js"></script>
    <title>Virtual Lab</title>
    <script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
    <script
      defer
      src="https://code.jquery.com/ui/1.8.17/jquery-ui.min.js"
    ></script>
    <script defer src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script defer src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
    <script
      defer
      type="text/javascript"
      src="//cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"
    ></script>
  </head>
  <body>
    <div class="container">
      <div class="title-div-container">
        <div class="title-div">
          <div class="logo-div">
            <a href="#"
              ><img src="images/logo_nitk.png" alt="Logo" class="logo"
            /></a>
          </div>
          <h1>
            Detection of both SAO and SA1 faults on a VLSI circuit for 3-bit
            EVEN parity generator circuit
          </h1>
        </div>
      </div>
      <div class="sidebar">
        <ul class="tool-menu">
          <li class="tool-list tool-practice" onclick="displayDiv(this)">
            <a class="tool-link" title="Experiment"
              ><img src="./images/solution.png" alt="solution" class="icons"
            /></a>
            <span>Simulation</span>
          </li>

          <li class="tool-list tool-add" onclick="out()">
            <a class="tool-link" title="Add"
              ><img src="./images/add2.png" alt="solution" class="icons"
            /></a>
            <span>Add</span>
          </li>

          <li class="tool-list tool-print" onclick="window.print()">
            <a class="tool-link" title="Print"
              ><img src="./images/print1.png" alt="solution" class="icons"
            /></a>
            <span>Print</span>
          </li>
          <li class="tool-list tool-reset" onclick="displayDiv(this)">
            <a class="tool-link" title="Help" onclick="Refresh()"
              ><img src="./images/bluecwdull.svg" alt="Help" class="icons"
            /></a>
            <span>Refresh</span>
          </li>
        </ul>
      </div>
      <div class="main">
        <div class="main-section">
          <div id="simulation" class="main__task-div">
            <h3 class="task-title">Simulation</h3>

            <div class="canvas__div">
              <div class="task-screen practice">
                <div class="circuit-div">
                  <img src="./images/circuit.png" alt="" class="circuit" />
                </div>
                <p class="eqn-title" id="textValue">
                  Equation of the fault detected =
                </p>
                <div class="circuit-input">
                  <div class="circuit-input--entry">
                    <p class="input-text">Fault</p>
                    <select name="fault" id="fault" class="input-select">
                      <option value="None">None</option>
                      <option value="SA0">SA0</option>
                      <option value="SA1">SA1</option>
                    </select>
                  </div>
                  <div class="circuit-input--entry">
                    <p class="input-text">Wire</p>
                    <select
                      name="wire"
                      id="wire"
                      class="input-select"
                      title="wire"
                    >
                      <option value="x">x</option>
                      <option value="y">y</option>
                      <option value="w">w</option>
                      <option value="z">z</option>
                    </select>
                  </div>
                  <div class="circuit-input--entry">
                    <p class="input-text">X</p>
                    <div class="input-toggle input-toggle--off">
                      <div class="input-toggle--button" id="X">0</div>
                    </div>
                  </div>
                  <div class="circuit-input--entry">
                    <p class="input-text">Y</p>
                    <div class="input-toggle input-toggle--off">
                      <div class="input-toggle--button" id="Y">0</div>
                    </div>
                  </div>
                  <div class="circuit-input--entry">
                    <p class="input-text">Z</p>
                    <div class="input-toggle input-toggle--off">
                      <div class="input-toggle--button" id="Z">0</div>
                    </div>
                  </div>
                </div>
                <div class="circuit-input--entry">
                  <button class="btn-submit">Submit</button>
                </div>
                <table class="result-table">
                  <tr>
                    <th colspan="3">Input</th>
                    <th rowspan="2">w</th>
                    <th rowspan="2">P</th>
                    <th rowspan="2">P'</th>
                  </tr>
                  <tr>
                    <th>x</th>
                    <th>y</th>
                    <th>z</th>
                  </tr>
                </table>
              </div>
            </div>

            <!-- <button
              class="btn btn-top hide"
              title="Move to Top"
              onclick="movetoTop()"
              ontouchstart="movetoTop"
            >
              ↑
            </button> -->
          </div>
        </div>

        <div class="main__task-div footer">
          <p>Copyright © SOLVE The Virtual Lab @ NITK Surathkal</p>
        </div>
      </div>
    </div>
    <script defer src="js/script.js"></script>
  <script src="../assets/js/iframeResize.js"></script>
        
        </body>
</html>
